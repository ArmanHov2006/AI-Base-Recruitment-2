[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-recruitment"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18",
    "authlib>=1.3",
    "aiosmtplib>=3.0",
    "asyncpg>=0.31",
    "pgvector>=0.2",
    "celery[redis]>=5.5",
    "fastapi>=0.136",
    "filetype>=1.2",
    "httpx>=0.28",
    "minio>=7.2",
    "ollama>=0.4",
    "openai>=2.37",
    "email-validator>=2.1",
    "bcrypt>=4.0",
    "pydantic-settings>=2.14",
    "pypdf>=6.11",
    "python-jose[cryptography]>=3.3",
    "python-docx>=1.2",
    "python-multipart>=0.0.29",
    "redis>=5.0",
    "reportlab>=4.2",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    "structlog>=25.5",
    "uvicorn[standard]>=0.47",
    "langdetect>=1.0",
    "elasticsearch[async]>=8.13,<9",
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "mypy>=2.1",
    "ruff>=0.15",
    "pip-audit>=2.10",
    "httpx>=0.28",
]
# OCR support — requires system packages: tesseract-ocr + poppler-utils
# Install with: uv pip install -e ".[ocr]"
ocr = [
    "pytesseract>=0.3",
    "pdf2image>=1.17",
    "Pillow>=10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"app/llm/*.py" = ["E501"]
"scripts/*.py" = ["E501"]
"tests/test_storage.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
disable_error_code = ["attr-defined", "union-attr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
